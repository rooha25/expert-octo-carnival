<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일렁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--font-title:'Gowun Batang','Noto Serif KR','Batang',serif;--font-body:'Gowun Dodum','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;--ink:#e8f1ff;--dim:#7f9bc7;--deep:#02060f;--sea:#0a2a5e;--glow:#4aa3ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--sea) 0%,#041433 40%,var(--deep) 100%);color:var(--ink);
 font-family:var(--font-body);
 display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 12px calc(88px + env(safe-area-inset-bottom));overflow-x:hidden}
header{width:min(92vw,560px);display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
h1{font-family:var(--font-title);font-size:clamp(28px,7vw,40px);font-weight:400;letter-spacing:.2em}
#count{font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.hint{width:min(92vw,560px);font-size:12px;color:var(--dim);margin-bottom:14px}
.board{--W:min(92vw,560px,calc((100vh - 215px)/var(--R)));--R:1;--H:calc(var(--W)*var(--R));--b:26px;--sc:1.1;
 position:relative;width:var(--W);height:var(--H);overflow:hidden;border-radius:6px;
 background:#030a1c;box-shadow:0 0 60px rgba(40,120,255,.18)}
.stage{position:absolute;inset:0;filter:blur(var(--b));transform:scale(var(--sc));transition:filter 1s,transform 1s}
.p{position:absolute;left:0;width:100%;top:calc(var(--H)*var(--y));height:calc(var(--H)*var(--bh));
 transition:top .45s cubic-bezier(.3,.8,.3,1),transform .25s}
.p .img{position:absolute;inset:0;background-size:var(--W) var(--H);background-repeat:no-repeat;
 background-position:0 calc(var(--H)*var(--o));filter:saturate(.9) brightness(.8);transition:filter .3s}
.p.sel{transform:translateX(8px)}
.p.sel .img{filter:saturate(1.3) brightness(1.3)}
.p.ok .img{filter:none}
.edges{position:absolute;inset:0;z-index:2;pointer-events:none}
.e{position:absolute;left:0;width:100%;top:calc(var(--H)*var(--y));height:calc(var(--H)*var(--bh));
 transition:top .45s cubic-bezier(.3,.8,.3,1),transform .25s}
.e svg{display:block;width:100%;height:100%;overflow:visible}
.e path{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.e .d{stroke:rgba(0,6,20,.12);stroke-width:2px}
.e .l{stroke:rgba(170,210,255,.16);stroke-width:1px}
.e.sel{transform:translateX(8px)}
.e.sel .l{stroke:rgba(255,255,255,.55)}
.e.ok .d{stroke:rgba(0,6,20,.18);stroke-width:2px}
.e.ok .l{stroke:rgba(210,235,255,.3);stroke-width:1px}
.row{position:absolute;left:0;width:100%;top:calc(var(--H)*var(--t));height:calc(var(--H)*var(--hf));z-index:3;
 display:flex;align-items:center;gap:.7em;padding:0 3%;cursor:pointer;white-space:nowrap;overflow:hidden;
 font-size:clamp(10px,calc(var(--W)/40),14px);color:#cfe2ff;text-shadow:0 0 6px #000,0 0 2px #000;
 transition:top .45s cubic-bezier(.3,.8,.3,1),transform .25s;-webkit-tap-highlight-color:transparent}
.row b{font-weight:600;font-variant-numeric:tabular-nums;color:#8fc4ff}
.row.sel{transform:translateX(8px)}
.row.ok{cursor:default;pointer-events:none;color:#fff}
.row:focus-visible{outline:2px solid #fff;outline-offset:-2px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
 width:min(92vw,420px);height:52px;display:flex;align-items:center;gap:12px;padding:0 14px 0 8px;
 background:rgba(5,16,40,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border:1px solid rgba(110,170,255,.25);border-radius:30px;z-index:20;transition:opacity 1s,width .8s}
#pp{width:36px;height:36px;border-radius:50%;border:0;background:var(--glow);color:#02101f;cursor:pointer;font-size:14px;flex:none}
#pp:focus-visible{outline:2px solid #fff;outline-offset:2px}
#meta{flex:1;min-width:0}
#now{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:3px;margin-top:6px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--glow)}
#final{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(100% 100% at 50% 40%,#0a2a5e,#010409);opacity:0;pointer-events:none;transition:opacity 1.6s}
#final img{max-width:100vw;max-height:100vh;width:min(100vw,100vh);height:auto;object-fit:contain;filter:none}
body.done #final{opacity:1}
body.done header,body.done .hint,body.done .board{opacity:0;transition:opacity .8s}
body.done #meta{display:none}
body.done #bar{width:52px;padding:0 8px;opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>일렁</h1><span id="count">0 / 17</span></header>
<p class="hint">조각을 눌러 곡을 듣고, 두 조각을 차례로 눌러 자리를 바꿔 보세요.</p>
<main class="board" id="board" aria-label="사운드 웨이브 퍼즐"></main>

<div id="bar">
  <button id="pp" aria-label="재생 또는 일시정지">▶</button>
  <div id="meta"><div id="now">조각을 눌러 재생</div><div id="prog"><i id="pg"></i></div></div>
</div>
<div id="final"><img id="fimg" alt="일렁 앨범 커버"></div>

<script>
/* ============ 설정 ============ */
const ALBUM_COVER_URL = 'https://www.melon.com/album/detail.htm?albumId=14571156'; // 앨범 커버 이미지 주소 (정사각형 권장). 비워 두면 임시 이미지가 표시됩니다.

// title: 곡 제목 / file: mp3 파일 경로(index.html과 같은 폴더면 파일명만) / start: 하이라이트 시작 초
const TRACKS = [
  { title: '다시 불행해지나 봐', file: 'track01.mp3', start: 101 },
  { title: '눈물에 녹여서', file: 'track02.mp3', start: 67 },
  { title: '조금만 더 걸어볼까', file: 'track03.mp3', start: 75 },
  { title: '우리 꼭 여름에서 죽자', file: 'track04.mp3', start: 0 },
  { title: '딥블루 (파손주의)', file: 'track05.mp3', start: 136 },
  { title: '뱃멀미', file: 'track06.mp3', start: 205 },
  { title: '더워', file: 'track07.mp3', start: 105 },
  { title: '각설이', file: 'track08.mp3', start: 120 },
  { title: '여름감기', file: 'track09.mp3', start: 123 },
  { title: '좋겠다 (파손주의)', file: 'track10.mp3', start: 21 },
  { title: '소풍 갈까', file: 'track11.mp3', start: 89 },
  { title: '밤송이', file: 'track12.mp3', start: 88 },
  { title: '풋사과', file: 'track13.mp3', start: 99 },
  { title: '아무것도 안 보는 게 나아', file: 'track14.mp3', start: 117 },
  { title: '비가 와도 괜찮아', file: 'track15.mp3', start: 63 },
  { title: '난 너 믿어', file: 'track16.mp3', start: 100 },
  { title: '유언', file: 'track17.mp3', start: 71 }
];
/* ================================ */

const N = 17, STEPS = 28, E = .045;           // E: 조각이 위아래로 여유 있게 가지는 영역(파도 진폭 한계)
const board = document.getElementById('board');
const $ = id => document.getElementById(id);

/* 이미지 (미설정/오류 시 임시 일렁 이미지 생성) */
function fallbackCover(){
  const c = document.createElement('canvas'); c.width = c.height = 800;
  const g = c.getContext('2d'), gr = g.createRadialGradient(400,330,20,400,400,600);
  gr.addColorStop(0,'#2e7bff'); gr.addColorStop(.45,'#0a2a5e'); gr.addColorStop(1,'#020611');
  g.fillStyle = gr; g.fillRect(0,0,800,800);
  g.lineWidth = 3;
  for(let r=40;r<620;r+=34){ g.strokeStyle = `rgba(150,200,255,${Math.max(.05,.7-r/900)})`; g.beginPath();
    for(let a=0;a<=6.3;a+=.04){ const rr=r+8*Math.sin(a*7+r/20); g.lineTo(400+rr*Math.cos(a),400+rr*Math.sin(a)); }
    g.stroke(); }
  return c.toDataURL('image/jpeg',.92);
}
let COVER = ALBUM_COVER_URL || './cover.jpg';
const setCover = u => { COVER=u; $('fimg').src=u; document.querySelectorAll('.img').forEach(e=>e.style.backgroundImage=`url("${u}")`); };
const probe = new Image();
probe.onload  = () => board.style.setProperty('--R', (probe.naturalHeight/probe.naturalWidth).toFixed(4)); // 이미지 비율에 보드를 맞춤
probe.onerror = () => setCover('./cover.jpg');
probe.src = COVER;
$('fimg').src = COVER;

/* 들쭉날쭉한 파도 조각: 높이·진폭·주기가 조각마다 다름 (시드 고정 → 모두에게 같은 모양) */
let seed = 20240917;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };
const raw = Array.from({length:N}, () => .8 + rnd()*.65);
const sum = raw.reduce((a,b)=>a+b,0);
const HF = raw.map(v => v/sum);                       // 조각 높이 (합계 = 1 → 어떤 순서든 보드를 정확히 채움)
const TS = HF.map((_,i)=>HF.slice(0,i).reduce((a,b)=>a+b,0)); // 정답 위치의 시작 높이
const BD = Array.from({length:N+1}, (_,k) => ({           // 경계선 k의 파도 모양
  amp: (k===0||k===N) ? 0 : .012 + rnd()*.03,
  f:   1.3 + rnd()*3.4,
  ph:  rnd()*6.28
}));
const wv = (k,x) => BD[k].amp * Math.sin(2*Math.PI*BD[k].f*x + BD[k].ph);
function clipFor(s){
  const bh = HF[s] + 2*E, top=[], bot=[];
  for(let i=0;i<=STEPS;i++){
    const x=i/STEPS;
    top.push(`${(x*100).toFixed(2)}% ${((E+wv(s,x))/bh*100).toFixed(2)}%`);
    bot.push(`${(x*100).toFixed(2)}% ${((E+HF[s]+wv(s+1,x))/bh*100).toFixed(2)}%`);
  }
  return `polygon(${top.concat(bot.reverse()).join(',')})`;
}

function edgeSvg(s){
  const bh = HF[s] + 2*E; let t='', b='';
  for(let i=0;i<=STEPS;i++){
    const x=i/STEPS*100;
    t += `${i?'L':'M'}${x.toFixed(2)} ${((E+wv(s,i/STEPS))/bh*100).toFixed(2)} `;
    b += `${i?'L':'M'}${x.toFixed(2)} ${((E+HF[s]+wv(s+1,i/STEPS))/bh*100).toFixed(2)} `;
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="d" d="${t}${b}"/><path class="l" d="${t}${b}"/></svg>`;
}
/* 상태: order[슬롯] = 조각 번호 (정답은 order[j] === j) */
let order = [...Array(N).keys()];
do { for(let i=N-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } }
while(order.some((v,i)=>v===i));
let selected = null;
const locked = new Set();
const pcs = [], rows = [], eds = [];
const edgeLayer = document.createElement('div'); edgeLayer.className='edges';
const stage = document.createElement('div'); stage.className='stage'; board.appendChild(stage);

for(let s=0;s<N;s++){
  const p = document.createElement('div'); p.className='p';
  p.style.setProperty('--bh', HF[s]+2*E);
  p.style.setProperty('--o', E-TS[s]);
  p.style.clipPath = p.style.webkitClipPath = clipFor(s);
  p.innerHTML = `<div class="img" style="background-image:url('${COVER}')"></div>`;
  stage.appendChild(p); pcs.push(p);

  const r = document.createElement('div'); r.className='row'; r.tabIndex=0; r.setAttribute('role','button');
  r.style.setProperty('--hf', HF[s]);
  r.innerHTML = `<b>${String(s+1).padStart(2,'0')}</b><span>${TRACKS[s].title}</span>`;
  r.addEventListener('click',()=>pick(s));
  r.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(s); } });
  board.appendChild(r); rows.push(r);

  const e = document.createElement('div'); e.className='e';
  e.style.setProperty('--bh', HF[s]+2*E); e.innerHTML = edgeSvg(s);
  edgeLayer.appendChild(e); eds.push(e);
}
board.appendChild(edgeLayer);
/* 조각을 위에서부터 차례로 쌓음 → 순서가 섞여도 항상 정사각형을 빈틈 없이 채움 */
function place(){
  let cum = 0;
  order.forEach(s => {
    pcs[s].style.setProperty('--y', cum - E);
    rows[s].style.setProperty('--t', cum);
    eds[s].style.setProperty('--y', cum - E);
    cum += HF[s];
  });
}
place();
const mark = (s,c,on) => { pcs[s].classList.toggle(c,on); rows[s].classList.toggle(c,on); eds[s].classList.toggle(c,on); };

function pick(s){
  if(locked.has(s)) return;
  if(selected===null){ selected=s; mark(s,'sel',true); playTrack(s); return; }
  if(selected===s){ mark(s,'sel',false); selected=null; return; }
  const a=selected, b=s, ja=order.indexOf(a), jb=order.indexOf(b);
  mark(a,'sel',false); selected=null;
  order[ja]=b; order[jb]=a; place();
  const hit = [a,b].filter(p => order.indexOf(p)===p);
  hit.forEach(p => { locked.add(p); mark(p,'ok',true); });
  playTrack(hit.length ? hit[0] : b);
  update();
}

function update(){
  const n = locked.size;
  $('count').textContent = `${n} / ${N}`;
  board.style.setProperty('--b', (26*(1-n/N)).toFixed(1)+'px');
  board.style.setProperty('--sc', (1+.1*(1-n/N)).toFixed(3));
  if(n===N) setTimeout(()=>document.body.classList.add('done'), 900);
}
update();

/* ============ Audio (로컬 mp3) ============ */
/* 모바일 차단 정책: Audio 객체를 "첫 조각 터치" 안에서 만들고 즉시 play() 한다.
   이후에는 같은 Audio 객체의 src만 바꿔 재생하므로 계속 허용 상태가 유지된다. */
let audio = null, cur = -1;
function initAudio(){
  if(audio) return;
  audio = new Audio();
  audio.preload = 'auto';
  audio.addEventListener('play',  () => $('pp').textContent = '❚❚');
  audio.addEventListener('pause', () => $('pp').textContent = '▶');
  audio.addEventListener('ended', () => playTrack((cur+1) % N));   // 곡이 끝나면 다음 곡으로 이어 재생
  audio.addEventListener('timeupdate', () => {
    if(audio.duration) $('pg').style.width = (audio.currentTime/audio.duration*100)+'%';
  });
}
function playTrack(i){
  initAudio();
  cur = i;
  const t = TRACKS[i];
  $('now').textContent = `${String(i+1).padStart(2,'0')}  ${t.title}`;
  if(!t.file) return;
  audio.pause();
  audio.src = t.file;
  if(t.start){ audio.addEventListener('loadedmetadata', () => { audio.currentTime = t.start; }, {once:true}); }
  const p = audio.play();                                   // 터치 이벤트 안에서 즉시 재생
  if(p && p.catch) p.catch(err => console.warn('재생 실패:', t.file, err));
}
$('pp').addEventListener('click',()=>{
  initAudio();
  if(!audio.src){ if(cur>=0) playTrack(cur); return; }
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
});
</script>
</body>
</html>
